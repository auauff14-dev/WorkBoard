<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WorkBoard</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f4f6f8;
    color: #222;
    font-family: "Yu Gothic", Meiryo, sans-serif;
}

header {
    background: #1E3A5F;
    color: white;
    padding: 10px 15px;
    font-size: 17px;
    font-weight: bold;
}

.toolbar {
    padding: 8px;
    background: white;
    display: flex;
    gap: 5px;
    position: sticky;
    top: 0;
    z-index: 20;
    border-bottom: 1px solid #ddd;
}

#search {
    flex: 1;
    min-width: 100px;
    padding: 6px 8px;
    border: 1px solid #bbb;
    border-radius: 5px;
}

button {
    font-family: inherit;
    padding: 5px 8px;
    border: 1px solid #bbb;
    border-radius: 5px;
    background: white;
    cursor: pointer;
}

button:hover {
    background: #eef5ff;
}

#list {
    padding: 7px;
    max-width: 1000px;
    margin: auto;
}

.group {
    margin-bottom: 8px;
}

.group-header {
    display: flex;
    align-items: center;
    gap: 5px;
    background: #e9eef5;
    border: 1px solid #d4dbe5;
    border-radius: 5px;
    padding: 5px 7px;
    min-height: 32px;
    cursor: grab;
    transition: background 0.18s ease;
}
.group-header:hover {
    background: #dde6f1;
}

.group-toggle:hover {
    background: transparent;
}

.group-name {
    flex: 1;
    font-weight: bold;
    cursor: default;
}

.group-actions {
    display: flex;
    gap: 3px;
}

.group-actions button {
    padding: 3px 6px;
    font-size: 11px;
}

.group-items {
    padding-left: 12px;
    padding-top: 3px;
}

.group-header:hover {
    background: #dfe7f2;
}

.card {
    position: relative;
    background: white;
    border: 1px solid #ddd;
    border-radius: 5px;
    padding: 4px 6px;
    margin-bottom: 3px;
    display: flex;
    align-items: center;
    gap: 6px;
    min-height: 34px;
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
}

.card:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.16);
    border-color: #cbd5e1;
    background: #f8fbff;
}

.tooltip {
    display: none;
    position: absolute;
    left: 0;
    top: calc(100% + 5px);
    width: 430px;
    max-width: 60vw;
    max-height: 260px;
    overflow-y: auto;
    overflow-x: hidden;
    background: #222;
    color: white;
    padding: 9px 11px;
    border-radius: 6px;
    white-space: pre-wrap;
    word-break: break-word;
    z-index: 100;
    box-shadow: 0 3px 12px rgba(0,0,0,0.35);
    font-size: 13px;
    font-weight: normal;
    line-height: 1.5;
    overscroll-behavior: contain;
}

.name-area:hover .tooltip {
    display: block;
}

.tooltip:hover {
    display: block;
}

.name-area {
    flex: 1;
    min-width: 0;
}

.actions {
    display: flex;
    align-items: center;
    gap: 4px;
    opacity: 1;
    pointer-events: auto;
    transition: opacity 0.18s ease;
    flex-shrink: 0;
    white-space: nowrap;
}

.card:hover .actions {
    opacity: 1;
    pointer-events: auto;
}

.actions button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 4px 8px;
    font-size: 12px;
    line-height: 1.2;
    white-space: nowrap;
    min-height: 24px;
}

.actions button.copy-open {
    padding: 4px 12px;
    min-width: 72px;
}

.actions button.action-edit,
.actions button.action-delete {
    min-width: 28px;
    width: 28px;
    padding: 4px 6px;
}

.actions button.action-edit {
    margin-left: auto;
}

#addBox {
    display: none;
    padding: 10px;
    background: white;
    border-bottom: 1px solid #ddd;
}

#addBox input,
#addBox textarea,
#addBox select {
    width: 100%;
    margin: 3px 0 7px;
    padding: 6px;
    border: 1px solid #bbb;
    border-radius: 5px;
    font-family: inherit;
}

#addBox textarea {
    min-height: 70px;
    resize: vertical;
}

.form-label {
    font-size: 12px;
    font-weight: bold;
    margin-top: 5px;
    display: block;
}

#hint {
    font-size: 11px;
    color: #666;
    padding: 5px 9px 1px;
}

.drag-over {
    border-top: 3px solid #1f6feb;
}

#toast {
    position: fixed;
    right: 20px;
    bottom: 20px;
    background: #222;
    color: white;
    padding: 10px 16px;
    border-radius: 6px;
    font-size: 13px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.3);
    opacity: 0;
    transform: translateY(10px);
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 9999;
}

#toast.show {
    opacity: 1;
    transform: translateY(0);
}

.modal-bg {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.35);
    z-index: 500;
}

.modal-bg .modal {
    transition: transform 0.18s ease, opacity 0.18s ease;
}

.modal-bg.closing .modal {
    opacity: 0;
    transform: translate(-50%,-50%) scale(0.98);
}

.modal {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(0.98);
    box-shadow: 0 5px 25px rgba(0,0,0,0.3);
    background: white;
    color: #222;
    border-radius: 10px;
    padding: 16px 18px;
    width: min(92vw, 380px);
    max-width: calc(100vw - 32px);
    max-height: calc(100vh - 40px);
    overflow: auto;
    box-sizing: border-box;
}

.modal h3 {
    margin-top: 0;
    margin-bottom: 10px;
}

.modal input,
.modal textarea,
.modal select {
    width: 100%;
    padding: 7px;
    margin-bottom: 8px;
    border: 1px solid #bbb;
    border-radius: 5px;
    font-family: inherit;
}

.modal textarea {
    min-height: 120px;
    resize: vertical;
}

.translate-actions,
.translate-services {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 10px;
}

.translate-actions button,
.translate-services button {
    flex: 1 1 auto;
    min-width: 90px;
}

body.dark .modal input,
body.dark .modal textarea,
body.dark .modal select{
    background:#374151;
    color:#ffffff;
    border:1px solid #4b5563;
}
body.dark input::placeholder,
body.dark textarea::placeholder{
    color:#cbd5e1;
}
.translate-actions button span.small-note {
    display: block;
    margin-top: 3px;
    font-size: 11px;
    line-height: 1.2;
    opacity: 0.76;
}
.memo-indicator {
    position: fixed;
    left: 20px;
    bottom: 20px;
    background: white;
    color: #222;
    border: 1px solid #bbb;
    border-radius: 8px;
    padding: 10px 12px;
    box-shadow: 0 4px 18px rgba(0,0,0,0.16);
    cursor: pointer;
    z-index: 9998;
    font-size: 13px;
    transition: transform 0.12s ease, background 0.18s ease;
}
.memo-indicator:hover {
    transform: translateY(-1px);
    background: #eef5ff;
}
body.dark .memo-indicator {
    background: #1f2937;
    color: #f8fafc;
    border-color: #374151;
    box-shadow: 0 4px 18px rgba(0,0,0,0.35);
}
.modal textarea#memoText {
    min-height: 220px;
}

.modal-buttons {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
}

.confirm-message {
    white-space: pre-wrap;
    margin-bottom: 15px;
    line-height: 1.5;
}

@media (max-width: 650px) {

    .toolbar {
        flex-wrap: wrap;
    }

    #search {
        flex-basis: 100%;
    }

    .tooltip {
        position: fixed;
        left: 5vw;
        right: 5vw;
        top: 90px;
        width: auto;
        max-width: none;
        max-height: 60vh;
    }

}
/* ==========================
   ダークモード
========================== */

body.dark{
    background:#1e1e1e;
    color:#f5f5f5;
}

body.dark header{
    background:#0f172a;
}

body.dark .toolbar{
    background:#2b2b2b;
}
body.dark button{
    background:#374151;
    color:white;
    border:1px solid #4b5563;
}

body.dark button:hover{
    background:#4b5563;
}
body.dark {
    color: white;
}
body.dark .card{
    background:#2d2d2d;
    border-color:#444;
}
body.dark .group-header{
    color:#ffffff;
}
body.dark .group-header{
    background:#374151;
    border-color:#4b5563;
}
body.dark .group-header:hover {
    background: #45556e;
}

body.dark .group-name{
    color:#ffffff;
}
body.dark .help{
    color:#cbd5e1;
}
body.dark .tips{
    color:#cbd5e1;
}
body.dark #hint{
    color:#cbd5e1;
}
/* ==========================
   設定画面
========================== */

.settings-modal{
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 9999;
}

.modal-content{
    width: 320px;
    background: white;
    border-radius: 12px;
    padding: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,.3);
}

body.dark .modal-content{
    background:#2d2d2d;
    color:white;
}

body.dark .modal {
    background: #2d2d2d;
    color: #ffffff;
    border: 1px solid #4b5563;
}

body.dark .modal h3 {
    color: #ffffff;
}

body.dark .modal input,
body.dark .modal textarea,
body.dark .modal select {
    background:#374151;
    color:#ffffff;
    border:1px solid #4b5563;
}

body.dark .modal button {
    background: #374151;
    color: #ffffff;
    border: 1px solid #4b5563;
}

.dragging{opacity:.75;transform:scale(1.02);box-shadow:0 12px 24px rgba(0,0,0,.28)!important;}
.drop-target{outline:2px solid #3b82f6;outline-offset:2px;}

/* コンテキストメニュー */
#contextMenu{position:absolute;min-width:160px;background:#ffffff;color:#222;border:1px solid #bbb;border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.2);padding:6px;z-index:20000;display:none}
#contextMenu .menu-item{padding:8px 10px;cursor:pointer;border-radius:4px}
#contextMenu .menu-item:hover{background:#f0f4f8}
body.dark #contextMenu{background:#2d2d2d;color:#f5f5f5;border:1px solid #4b5563;box-shadow:0 6px 20px rgba(0,0,0,.6)}
body.dark #contextMenu .menu-item:hover{background:#374151}
/* UI animations */
.group-items{
    overflow: hidden;
    max-height: 1000px;
    opacity: 1;
    transition: max-height 0.18s ease, opacity 0.18s ease;
}
.group-items.collapsed{
    max-height: 0;
    opacity: 0;
}

/* cards appear animation */
.card{opacity:0;transform:translateY(6px);transition:opacity 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease}
.card.appear{opacity:1;transform:none}

/* modal open/close */
.modal{transition:transform 0.18s ease, opacity 0.18s ease;transform:translate(-50%,-50%) scale(0.98);opacity:0}
.modal-bg[style*="display: block"] .modal{transform:translate(-50%,-50%) scale(1);opacity:1}
.modal-bg.closing .modal{opacity:0;transform:translate(-50%,-50%) scale(0.98)}

/* button hover slight lift */
button{transition:transform 0.12s ease}
button:hover{transform:translateY(-1px)}

/* context menu fade (JS will toggle opacity/transform) */
#contextMenu{opacity:0;transform:translateY(-6px);transition:opacity 0.16s ease, transform 0.16s ease}

</style>

</head>

<body>

<header>
WorkBoard<br><span style="font-size:12px;font-weight:400;opacity:.85">One Click Work Tool</span>

<script>

/* ==================================================
   初期データ
================================================== */

const defaultData = {

    groups: [

        {
            id: "default",
            name: "未分類",
            collapsed: false
        }

    ],

    items: [

        {
            id: crypto.randomUUID(),
            groupId: "default",
            name: "w1kiw1",
            type: "text",
            content: "w1kiw1"
        },

        {
            id: crypto.randomUUID(),
            groupId: "default",
            name: "W1KIWTE",
            type: "text",
            content: "W1KIWTE"
        },

        {
            id: crypto.randomUUID(),
            groupId: "default",
            name: "W1KIWR",
            type: "text",
            content: "W1KIWR"
        }

    ]

};


/* ==================================================
   データ読み込み
================================================== */

let data = JSON.parse(
    localStorage.getItem("copyToolData")
);


/* ==================================================
   旧データからの移行
================================================== */

if (
    !data ||
    !Array.isArray(data.groups) ||
    !Array.isArray(data.items)
) {

    const oldData = JSON.parse(
        localStorage.getItem("copyToolItems")
    );

    if (Array.isArray(oldData)) {

        data = {

            groups: [

                {
                    id: "default",
                    name: "未分類",
                    collapsed: false
                }

            ],

            items: oldData
                .map(item => {

                    if (
                        Array.isArray(item) &&
                        item.length >= 3
                    ) {

                        return {

                            id:
                                crypto.randomUUID(),

                            groupId:
                                "default",

                            name:
                                String(item[1]),

                            type:
                                "text",

                            content:
                                String(item[2])

                        };

                    }

                    if (
                        Array.isArray(item) &&
                        item.length >= 2
                    ) {

                        return {

                            id:
                                crypto.randomUUID(),

                            groupId:
                                "default",

                            name:
                                String(item[0]),

                            type:
                                "text",

                            content:
                                String(item[1])

                        };

                    }

                    return null;

                })
                .filter(item => item !== null)

        };

    }

    else {

        data = JSON.parse(
            JSON.stringify(defaultData)
        );

    }

}


save();


let draggedItemId = null;

let draggedGroupId = null;

let editingItemId = null;

let groupModalMode = "add";

let editingGroupId = null;

let confirmAction = null;
 
// removed color-selection state (feature rolled back)


/* ==================================================
   保存
================================================== */

function save() {

    localStorage.setItem(
        "copyToolData",
        JSON.stringify(data)
    );

}


/* ==================================================
   コピー通知
================================================== */

let toastTimer = null;


function showToast() {

    const toast =
        document.getElementById("toast");

    clearTimeout(toastTimer);

    toast.classList.add("show");

    toastTimer = setTimeout(
        () => {

            toast.classList.remove("show");

        },
        1500
    );

}


/* ==================================================
   コピー
================================================== */

async function copyText(text) {

    try {

        await navigator.clipboard.writeText(text);

    }

    catch (e) {

        const textarea =
            document.createElement("textarea");

        textarea.value = text;

        document.body.appendChild(textarea);

        textarea.select();

        document.execCommand("copy");

        textarea.remove();

    }

    showToast();

}


/* ==================================================
   グループ選択肢更新
================================================== */

function updateGroupSelects() {

    const selects = [

        document.getElementById("newGroup"),

        document.getElementById("editGroup")

    ];

    selects.forEach(select => {

        if (!select) {

            return;

        }

        select.innerHTML = "";

        data.groups.forEach(group => {

            const option =
                document.createElement("option");

            option.value =
                group.id;

            option.textContent =
                group.name;

            select.appendChild(option);

        });

    });

}


/* ==================================================
   一覧表示
================================================== */

function render() {

    const list =
        document.getElementById("list");

    const searchText =
        document
            .getElementById("search")
            .value
            .toLowerCase();

    list.innerHTML = "";

    updateGroupSelects();


    data.groups.forEach(group => {

        const groupItems =
            data.items.filter(
                item =>
                    item.groupId === group.id
            );


        const filteredItems =
            groupItems.filter(item => {

                if (!searchText) {

                    return true;

                }

                return (

                    item.name +
                    " " +
                    item.content

                )
                .toLowerCase()
                .includes(searchText);

            });


        if (
            searchText &&
            filteredItems.length === 0
        ) {

            return;

        }


        const groupElement =
            document.createElement("div");

        groupElement.className =
            "group";

        groupElement.draggable = true;


        /* ==================================================
           グループドラッグ開始
        ================================================== */

        groupElement.addEventListener(
            "dragstart",
            function(event) {

                if (
                    event.target.closest(".group-actions") ||
                    event.target.closest(".group-toggle")
                ) {

                    event.preventDefault();

                    return;

                }

                draggedGroupId =
                    group.id;

                draggedItemId = null;

/* ==================================================
   カード用コンテキストメニュー
================================================== */

function showContextMenu(x, y, kind, id) {

    // color feature removed; do not track selected ids

    let menu = document.getElementById('contextMenu');

    if (!menu) {

        menu = document.createElement('div');

        menu.id = 'contextMenu';

        const makeItem = (label, handler) => {

            const el = document.createElement('div');

            el.className = 'menu-item';

            el.textContent = label;

            el.addEventListener('click', (e) => {

                e.stopPropagation();
                try { handler(); } catch (err) { console.error(err); }
                hideContextMenu();

            });

            return el;

        };

        document.body.appendChild(menu);

    }

    // メニュー中身を差し替え
    menu.innerHTML = '';

    if (kind === 'card') {
        menu.appendChild(createMenuItem('編集', () => openEdit(id)));
    }
    else if (kind === 'group') {
        menu.appendChild(createMenuItem('編集', () => openGroupEdit(id)));
    }

    // 位置調整・フェードイン
    menu.style.left = (x + 2) + 'px';
    menu.style.top = (y + 2) + 'px';
    menu.style.opacity = '0';
    menu.style.transform = 'translateY(-6px)';
    menu.style.display = 'block';
    requestAnimationFrame(() => {
        menu.style.opacity = '1';
        menu.style.transform = 'translateY(0)';
    });

    function createMenuItem(label, handler) {
        const el = document.createElement('div');
        el.className = 'menu-item';
        el.textContent = label;
        el.addEventListener('click', (e) => { e.stopPropagation(); handler(); hideContextMenu(); });
        el.addEventListener('mouseenter', () => el.style.background = '');
        return el;
    }

}

function hideContextMenu() {
    const menu = document.getElementById('contextMenu');
    if (menu) {
        menu.style.opacity = '0';
        menu.style.transform = 'translateY(-6px)';
        setTimeout(() => { if (menu) menu.style.display = 'none'; }, 180);
    }
}

function detectTranslateDirection(text) {
    const trimmed = text.trim();
    if (!trimmed) {
        return 'en-ja';
    }

    const japaneseChars = (trimmed.match(/[\u3040-\u30ff\u4e00-\u9faf]/g) || []).length;
    const latinLetters = (trimmed.match(/[A-Za-z]/g) || []).length;
    const digits = (trimmed.match(/[0-9]/g) || []).length;
    const totalChars = trimmed.length;
    const asciiOnly = /^[A-Za-z0-9\s\p{P}]+$/u.test(trimmed);

    if (japaneseChars > 0) {
        const japaneseRatio = japaneseChars / totalChars;
        if (japaneseRatio >= 0.2) {
            return 'ja-en';
        }
    }

    if (asciiOnly) {
        return 'en-ja';
    }

    if (latinLetters > 0) {
        const latinRatio = latinLetters / totalChars;
        if (latinRatio >= 0.5) {
            return 'en-ja';
        }
    }

    return 'unknown';
}

function openTranslateService(service) {
    const text = document.getElementById('translateText').value || '';
    let direction = detectTranslateDirection(text);

    if (direction === 'unknown') {
        const useEnglishToJapanese = window.confirm('文章の判定ができませんでした。英→日で開きますか？');
        direction = useEnglishToJapanese ? 'en-ja' : 'ja-en';
    }

    const encoded = encodeURIComponent(text);
    let url = '';

    if (service === 'google') {
        if (direction === 'en-ja') {
            url = `https://translate.google.com/?sl=en&tl=ja&text=${encoded}&op=translate`;
        } else {
            url = `https://translate.google.com/?sl=ja&tl=en&text=${encoded}&op=translate`;
        }
    }
    else if (service === 'deepl') {
        if (direction === 'en-ja') {
            url = `https://www.deepl.com/translator#en/ja/${encoded}`;
        } else {
            url = `https://www.deepl.com/translator#ja/en/${encoded}`;
        }
    }

    if (url) {
        window.open(url, '_blank');
    }
}

            .getElementById(
                "editName"
            )
            .value
            .trim();


    const type =
        document
            .getElementById(
                "editType"
            )
            .value;


    const content =
        document
            .getElementById(
                "editText"
            )
            .value;


    const groupId =
        document
            .getElementById(
                "editGroup"
            )
            .value;


    if (
        !name ||
        !content
    ) {

        showConfirmMessage(
            "入力エラー",
            "タイトルと内容を入力してください。"
        );

        return;

    }


    item.name =
        name;

    item.type =
        type;

    item.content =
        content;

    item.groupId =
        groupId;


    save();

    closeEdit();

    render();

}


/* ==================================================
   編集を閉じる
================================================== */

function closeEdit() {

    const modalBg = document.getElementById(
            "editModalBg"
        );
    modalBg.classList.add('closing');
    setTimeout(() => {
        modalBg.style.display = "none";
        modalBg.classList.remove('closing');
    }, 180);

    editingItemId =
        null;

}


/* ==================================================
   項目削除
================================================== */

function deleteItem(id) {

    const item =
        data.items.find(
            i =>
                i.id === id
        );


    if (!item) {

        return;

    }


    openConfirmModal(

        "項目を削除",

        "「" +
        item.name +
        "」を削除しますか？",

        function() {

            data.items =
                data.items.filter(
                    i =>
                        i.id !== id
                );


            save();

            render();

        }

    );

}


/* ==================================================
   バックアップ
================================================== */

function exportData() {

    const blob =
        new Blob(

            [
                JSON.stringify(
                    data,
                    null,
                    2
                )
            ],

            {
                type:
                    "application/json"
            }

        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    const date =
        new Date()
            .toISOString()
            .slice(
                0,
                10
            );


    link.href =
        url;


    link.download =
        "仕事用ツール_バックアップ_" +
        date +
        ".json";


    link.click();


    URL.revokeObjectURL(
        url
    );

}


/* ==================================================
   復元
================================================== */

function importData(event) {

    const file =
        event.target.files[0];


    if (!file) {

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
        function(e) {

            try {

                const imported =
                    JSON.parse(
                        e.target.result
                    );


                if (
                    !imported.groups ||
                    !imported.items
                ) {

                    throw new Error();

                }


                openConfirmModal(

                    "バックアップを復元",

                    "現在のデータをバックアップデータで置き換えますか？",

                    function() {

                        data =
                            imported;


                        save();

                        render();

                        showConfirmMessage(
                            "復元完了",
                            "バックアップを復元しました。"
                        );

                    }

                );

            }

            catch (error) {

                showConfirmMessage(
                    "復元エラー",
                    "バックアップファイルを読み込めませんでした。"
                );

            }


            event.target.value =
                "";

        };


    reader.readAsText(
        file,
        "utf-8"
    );

}

function resetData() {

    openConfirmModal(

        "初期状態に戻しますか？\n\n現在のデータはすべて消えます。",

        function() {

            data =

                );


            data.items.forEach(

            );


            save();

            render();

        }

    );

}
